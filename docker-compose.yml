services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: diratrack
      POSTGRES_USER: diratrack
      POSTGRES_PASSWORD: diratrack
    ports:
      - "5432:5432"
    volumes:
      - diratrack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diratrack -d diratrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  diratrack-postgres:
